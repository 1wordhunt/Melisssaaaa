<style>

#fin{display:none;background:radial-gradient(#0000 40%,#0b0618cc);justify-content:flex-end;padding-bottom:7vh;pointer-events:none}

#fx{position:fixed;inset:0;pointer-events:none;z-index:6}
#cnt{display:inline-block}#cnt.p{animation:pp .35s}@keyframes pp{50%{transform:scale(1.5);color:#ff9ac8}}
#tt{position:fixed;top:26%;left:0;right:0;text-align:center;font:800 clamp(28px,8vw,52px) Georgia,serif;opacity:0;pointer-events:none;z-index:4;text-shadow:0 0 26px #ff2d6f,0 2px 8px #000}
#tt.on{animation:tt 2.8s ease-out}@keyframes tt{0%{opacity:0;transform:scale(.8)}20%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
#mu{position:fixed;top:12px;right:14px;z-index:7;font-size:24px;cursor:pointer}
#warp{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .9s;z-index:9}
#hh{position:fixed;inset:0;display:none;pointer-events:none;z-index:7}
#hh button{pointer-events:auto;position:absolute;margin:0;padding:10px 18px;font-size:16px}
#hagain{left:14px;top:max(12px,env(safe-area-inset-top))}
#act{right:16px;bottom:max(30px,env(safe-area-inset-bottom));display:none}
#hint{position:absolute;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));text-align:center;font-size:12px;opacity:.75;text-shadow:0 1px 6px #000;padding:0 20px}
</style></head><body>

<div class="ov" id="start"><h1>Ecrin'e Hediye 🎁</h1><p>10 kalbi topla, sürprizi aç.</p><p style="font-size:14px;opacity:.7">← → şerit değiştir · ↑ zıpla · ↓ kay<br>Telefonda: ekranı kaydır</p><button id="go">Başla</button></div>
<div class="ov" id="fin"><div id="msg"></div><button id="tele">✨ Eve ışınlan</button><button id="again">Tekrar oyna</button></div><div id="hh"><button id="hagain">↺</button><button id="act">E</button><div id="hint">WASD yürü · tıkla-sürükle ile bak · E dokun · Telefonda: sol yarı yürü, sağ yarı bak</div></div><div id="warp"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ✏️ Final mesajı: buradaki cümleleri kendin değiştirebilirsin
const MSG=["Ecrin! 🎉","10 kalbi de topladın, helal olsun!","Seninle arkadaş olmak çok güzel.","İyi ki varsın, hep böyle kal. 🌟","Bu oyun küçük bir hediye, umarım sevmişsindir. 🎁"];

const $=i=>document.getElementById(i),L=2.4,rnd=Math.random;
let state='menu',hearts=0,speed=5,acc=-15,px=0,lane=0,py=0,vy=0,slide=0,inv=0,shake=0,t=0,endT=0,fxOn=0,nm;
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.25;document.body.prepend(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(65,1,.1,220);C.position.set(0,4.4,7.5);
const mk=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const x=new THREE.CanvasTexture(c);x.anisotropy=4;return x};

// Gökyüzü + ışık
S.background=mk(4,256,(g,w,h)=>{const q=g.createLinearGradient(0,0,0,h);[[0,'#2d1560'],[.2,'#8a3a8c'],[.33,'#ff8f86'],[.4,'#ffc79a'],[1,'#ffc79a']].forEach(a=>q.addColorStop(a[0],a[1]));g.fillStyle=q;g.fillRect(0,0,w,h)});
S.fog=new THREE.Fog(0xffa89a,30,110);
const hemi=new THREE.HemisphereLight(0xffd9e8,0x40306a,.95);S.add(hemi);
const sun=new THREE.DirectionalLight(0xffe2c0,.9);sun.position.set(-8,16,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-14,right:14,top:22,bottom:-22,far:60});S.add(sun);
const glow=mk(128,128,g=>{const q=g.createRadialGradient(64,64,0,64,64,64);q.addColorStop(0,'#fff');q.addColorStop(.25,'#fffa');q.addColorStop(1,'#fff0');g.fillStyle=q;g.fillRect(0,0,128,128)});
const spr=(c,s)=>{const m=new THREE.Sprite(new THREE.SpriteMaterial({map:glow,color:c,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,transparent:true}));m.scale.set(s,s,1);return m};
const sunS=spr(0xffc890,90);sunS.position.set(0,12,-170);S.add(sunS);

// Ray + zemin
const gt=mk(256,256,g=>{g.fillStyle='#5a4c5e';g.fillRect(0,0,256,256);for(let i=0;i<1800;i++){g.fillStyle=`hsla(300,10%,${25+rnd()*30}%,.5)`;g.fillRect(rnd()*256,rnd()*256,2,2)}
[-2.4,0,2.4].forEach(c=>{const x=(c+5)/10*256;for(let y=0;y<256;y+=32){g.fillStyle='#0006';g.fillRect(x-25,y+8,50,12);g.fillStyle='#8a857d';g.fillRect(x-24,y+5,48,10);g.fillStyle='#aaa59b';g.fillRect(x-24,y+5,48,2)}[-15,15].forEach(o=>{g.fillStyle='#2f2f36';g.fillRect(x+o-3,0,7,256);g.fillStyle='#b9bfc9';g.fillRect(x+o-1,0,3,256);g.fillStyle='#fff8';g.fillRect(x+o,0,1,256);for(let y=7;y<256;y+=32){g.fillStyle='#1c1c20';g.fillRect(x+o-5,y,11,3)}})})});
gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(1,40);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(10,160),new THREE.MeshLambertMaterial({map:gt}));gr.rotation.x=-Math.PI/2;gr.position.z=-70;gr.receiveShadow=true;S.add(gr);
const sd=new THREE.Mesh(new THREE.PlaneGeometry(120,160),new THREE.MeshLambertMaterial({color:0x3a2c4e}));sd.rotation.x=-Math.PI/2;sd.position.set(0,-.05,-70);S.add(sd);

// Binalar: gerçekçi cepheler (duvar + çerçeveli pencereler + geceleri yanan pencere haritası)
const roofM=new THREE.MeshLambertMaterial({color:0x5a5560}),roofR=new THREE.MeshLambertMaterial({color:0x8a3b2e});
const FT=[['#9a5a46',1],['#d8c8a6',0],['#8f9199',0],['#b7a09c',0]].map(a=>{const lit=Array.from({length:32},()=>rnd()<.45),bal=Array.from({length:32},()=>rnd()<.12),cell=f=>{for(let r=0;r<8;r++)for(let c=0;c<4;c++)f(c*64+14,r*32+6,r*4+c)};
const map=mk(256,256,g=>{g.fillStyle=a[0];g.fillRect(0,0,256,256);for(let i=0;i<1800;i++){g.fillStyle=rnd()<.5?'#0002':'#fff2';g.fillRect(rnd()*256,rnd()*256,2,2)}
if(a[1]){g.fillStyle='#0003';for(let y=0;y<256;y+=6)g.fillRect(0,y,256,1)}
g.fillStyle='#0004';for(let y=30;y<256;y+=32)g.fillRect(0,y,256,3);
cell((x,y,i)=>{g.fillStyle='#24242c';g.fillRect(x-3,y-3,42,26);const q=g.createLinearGradient(0,y,0,y+20);q.addColorStop(0,'#a9c2d8');q.addColorStop(1,'#4d6178');g.fillStyle=q;g.fillRect(x,y,36,20);g.fillStyle='#24242c';g.fillRect(x+17,y,2,20);g.fillStyle='#d6cfc2';g.fillRect(x-5,y+22,46,3);if(bal[i]){g.fillStyle='#5d5a57';g.fillRect(x-6,y+25,48,3);g.fillStyle='#3a3a40';for(let k=0;k<=48;k+=6)g.fillRect(x-6+k,y+14,1,11)}})}),
em=mk(256,256,g=>{g.fillStyle='#000';g.fillRect(0,0,256,256);cell((x,y,i)=>{if(lit[i]){g.fillStyle=i%3?'#ffd69a':'#cfe6ff';g.fillRect(x,y,36,20)}})});
return[map,em]});
function bExtras(m,w,h,s){const add=(g,mt,x,y,z)=>{const e=new THREE.Mesh(g,mt);e.position.set(x,y,z);m.add(e);return e};
add(new THREE.BoxGeometry(w+.5,.6,w+.5),roofM,0,h/2+.3,0);
if(h<15)add(new THREE.ConeGeometry(w*.74,3.2,4),roofR,0,h/2+2.2,0).rotation.y=Math.PI/4;
else{add(new THREE.CylinderGeometry(.9,.9,1.8,10),roofM,w*.2,h/2+1.5,w*.15);add(new THREE.CylinderGeometry(.04,.04,3.5,5),roofM,-w*.2,h/2+2.3,-w*.1);add(new THREE.BoxGeometry(1.4,.9,1),roofM,-w*.25,h/2+1,w*.2)}
add(new THREE.BoxGeometry(.9,.35,w*.8),new THREE.MeshLambertMaterial({color:[0xc0392b,0x2a7ab9,0x2e8b57,0xd4a017][rnd()*4|0]}),-s*(w/2+.45),-h/2+2.6,0)}
const wt=mk(128,256,(g,w,h)=>{g.fillStyle='#2a2140';g.fillRect(0,0,w,h);for(let y=8;y<h;y+=24)for(let x=8;x<w;x+=24){g.fillStyle=rnd()<.45?'#ffd98a':'#463a66';g.fillRect(x,y,12,14)}});
const bl=[];for(let s=-1;s<2;s+=2)for(let i=0;i<12;i++){const w=6+rnd()*4,h=8+rnd()*16,tx=wt.clone(),st=FT[rnd()*4|0],t1=st[0].clone(),t2=st[1].clone();[t1,t2].forEach(x=>{x.needsUpdate=true;x.wrapS=x.wrapT=THREE.RepeatWrapping;x.repeat.set(w/8,h/24)});tx.needsUpdate=true;tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(w/6,h/8);
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),new THREE.MeshLambertMaterial({map:t1,emissive:0xffffff,emissiveMap:t2,emissiveIntensity:.15}));m.userData.o=.75+rnd()*.35;bExtras(m,w,h,s);m.position.set(s*(8+w/2+rnd()*3),h/2,-i*14-rnd()*6);S.add(m);bl.push(m)}

// Karakter
const P=new THREE.Group(),M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.6});
const bx=(w,h,d,c,x,y,z,pv)=>{const g=new THREE.BoxGeometry(w,h,d);if(pv)g.translate(0,-h/2,0);const m=new THREE.Mesh(g,M(c));m.position.set(x,y,z);m.castShadow=true;P.add(m);return m};
const ball=(r,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),M(c));m.position.set(x,y,z);m.castShadow=true;P.add(m)};
{const g=new THREE.CylinderGeometry(.34,.3,.85,14);g.scale(1,1,.65);const t=new THREE.Mesh(g,M(0xff5fa2));t.position.y=1.15;t.castShadow=true;P.add(t)}bx(.5,.6,.22,0x3b6fd8,0,1.2,.3);bx(.08,.5,.03,0x23407f,-.2,1.25,-.225);bx(.08,.5,.03,0x23407f,.2,1.25,-.225);ball(.2,0xff5fa2,0,1.6,.18);[-.1,.1].forEach(x=>ball(.035,0x222222,x,1.83,-.265));bx(.12,.03,.03,0xc0504d,0,1.72,-.27);ball(.28,0xffd2b0,0,1.8,0);ball(.31,0x5a3220,0,1.85,.07);const tail=new THREE.Group();tail.position.set(0,1.8,.28);P.add(tail);[[.14,0,0],[.11,-.2,.06],[.08,-.38,.1]].forEach(a=>{const m=new THREE.Mesh(new THREE.SphereGeometry(a[0],12,10),M(0x5a3220));m.position.set(0,a[1],a[2]);m.castShadow=true;tail.add(m)});
const cl=(r,h,c,x,y)=>{const g=new THREE.CylinderGeometry(r,r*.85,h,10);g.translate(0,-h/2,0);const m=new THREE.Mesh(g,M(c));m.position.set(x,y,0);m.castShadow=true;P.add(m);return m};
const legL=cl(.13,.8,0x2b3a8a,-.17,.82),legR=cl(.13,.8,0x2b3a8a,.17,.82),armL=cl(.09,.7,0xff5fa2,-.45,1.52),armR=cl(.09,.7,0xff5fa2,.45,1.52);
[legL,legR].forEach(l=>{const s=new THREE.Mesh(new THREE.BoxGeometry(.3,.16,.42),M(0xffffff));s.position.set(0,-.78,-.07);s.castShadow=true;l.add(s)});[armL,armR].forEach(a=>{const h=new THREE.Mesh(new THREE.SphereGeometry(.11,10,8),M(0xffd2b0));h.position.y=-.72;a.add(h)});S.add(P);

// Engeller
const stripe=mk(64,64,(g,w,h)=>{g.fillStyle='#f4f4f4';g.fillRect(0,0,w,h);g.fillStyle='#e0294a';for(let i=-4;i<5;i++){g.beginPath();g.moveTo(i*16,h);g.lineTo(i*16+8,h);g.lineTo(i*16+8+h,0);g.lineTo(i*16+h,0);g.fill()}});
const trainT=mk(128,128,(g,w,h)=>{g.fillStyle='#3a7bd5';g.fillRect(0,0,w,h);g.fillStyle='#ffd24a';g.fillRect(0,h*.62,w,h*.08);g.fillStyle='#d6f1ff';for(let i=0;i<4;i++)g.fillRect(8+i*30,h*.18,20,h*.3);g.fillStyle='#1e2a4a';g.fillRect(0,h*.82,w,h*.18)});
const mS=new THREE.MeshLambertMaterial({map:stripe}),mT=new THREE.MeshLambertMaterial({map:trainT}),mH=new THREE.MeshBasicMaterial({color:0xfff2b0});
const mkTr=(c1,c2)=>mk(512,180,(g,w,h)=>{g.fillStyle=c1;g.fillRect(0,0,w,h);g.fillStyle='#1d2330';g.fillRect(0,h*.84,w,h*.16);g.fillStyle=c2;g.fillRect(0,h*.66,w,h*.07);g.fillStyle='#fff6';g.fillRect(0,2,w,6);
for(let i=0;i<8;i++){const x=22+i*60;if(i==2||i==5){g.fillStyle='#0003';g.fillRect(x-6,10,52,h*.74);g.fillStyle='#9fb6cc';g.fillRect(x+2,22,16,70);g.fillRect(x+22,22,16,70)}else{g.fillStyle='#1d2330';g.fillRect(x-3,17,52,64);const q=g.createLinearGradient(0,20,0,76);q.addColorStop(0,'#b5cde2');q.addColorStop(1,'#4d6379');g.fillStyle=q;g.fillRect(x,20,46,56)}}
g.fillStyle='#0004';for(let x=0;x<w;x+=170)g.fillRect(x,0,3,h)});
const mkTf=c=>mk(128,192,(g,w,h)=>{g.fillStyle=c;g.fillRect(0,0,w,h);g.fillStyle='#1d2330';g.fillRect(0,h*.8,w,h*.2);g.fillStyle='#e8e8ee';g.fillRect(0,h*.7,w,6);g.fillStyle='#1b2430';g.fillRect(10,20,108,70);const q=g.createLinearGradient(0,20,0,90);q.addColorStop(0,'#6f8ba6');q.addColorStop(1,'#243445');g.fillStyle=q;g.fillRect(14,24,100,62);g.fillStyle='#111';g.fillRect(40,98,48,14);g.fillStyle='#ff9a2e';g.fillRect(44,101,40,8)});
const roofM2=new THREE.MeshLambertMaterial({color:0xaab0b8}),dk=new THREE.MeshLambertMaterial({color:0x23252b});
const TRN=[['#3a7bd5','#ffd24a'],['#c8382f','#f2f2f2'],['#2f8f6b','#ffd24a']].map(a=>{const s=new THREE.MeshLambertMaterial({map:mkTr(a[0],a[1])}),f=new THREE.MeshLambertMaterial({map:mkTf(a[0])});return[s,s,roofM2,dk,f,f]});
function trainX(m){const a=(g,mt,x,y,z)=>{const e=new THREE.Mesh(g,mt);e.position.set(x,y,z);e.castShadow=true;m.add(e)};
a(new THREE.BoxGeometry(1.7,.25,8.8),roofM2,0,1.72,0);a(new THREE.BoxGeometry(1.1,.3,1.5),roofM2,0,1.95,-2);a(new THREE.BoxGeometry(1.1,.3,1.5),roofM2,0,1.95,2.4);
[-2.9,2.9].forEach(z=>a(new THREE.BoxGeometry(1.7,.45,1.7),dk,0,-1.65,z))}
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d),gT=B(2.1,3.2,9),gH=B(.4,.3,.1),gB=B(2,.9,.4),gO=B(2.3,.5,.5),gP=B(.2,1.6,.2);
const obs=[],hArr=[],pts=[],ring=[];
function addObs(l,k,z){let m,d;
if(k==1){m=new THREE.Mesh(gT,TRN[rnd()*3|0]);m.position.y=1.9;d=9;[-.6,.6].forEach(x=>{const h=new THREE.Mesh(gH,mH);h.position.set(x,-.6,4.55);m.add(h)});trainX(m)}
else{m=new THREE.Group();if(k==0){const b=new THREE.Mesh(gB,mS);b.position.y=.55;m.add(b);d=.4}else{const b=new THREE.Mesh(gO,mS);b.position.y=1.75;m.add(b);[-1,1].forEach(x=>{const p=new THREE.Mesh(gP,mS);p.position.set(x*1.05,.8,0);m.add(p)});d=.5}}
m.traverse(o=>o.castShadow=true);m.position.x=l*L;m.position.z=z;S.add(m);obs.push({m,k,d,v:k==1&&rnd()<.4?9:0})}

// Kalp
const hs=new THREE.Shape();hs.moveTo(5,5);hs.bezierCurveTo(5,5,4,0,0,0);hs.bezierCurveTo(-6,0,-6,7,-6,7);hs.bezierCurveTo(-6,11,-3,15.4,5,19);hs.bezierCurveTo(12,15.4,16,11,16,7);hs.bezierCurveTo(16,7,16,0,10,0);hs.bezierCurveTo(7,0,5,5,5,5);
const hg=new THREE.ExtrudeGeometry(hs,{depth:4,bevelEnabled:true,bevelSize:1.2,bevelThickness:1.2,bevelSegments:3});hg.center();hg.scale(.045,.045,.045);
const hm=new THREE.MeshStandardMaterial({color:0xff2d6f,emissive:0xff1d5a,emissiveIntensity:.7,roughness:.25,metalness:.2});
const newHeart=()=>{const m=new THREE.Mesh(hg,hm);m.add(spr(0xff4d8d,2.8));m.castShadow=true;S.add(m);return m};
function spawn(z){const f=(rnd()*3|0)-1;for(let l=-1;l<2;l++)if(l!=f&&rnd()<.8)addObs(l,rnd()<.45?1:rnd()<.5?0:2,z);
if(hearts+hArr.length<10){const m=newHeart();m.position.set(f*L,1.2,z);hArr.push(m)}
if(!pu&&fly<=0&&rnd()<.35){pu=new THREE.Mesh(new THREE.OctahedronGeometry(.5),new THREE.MeshStandardMaterial({color:0x66e0ff,emissive:0x2299ff,emissiveIntensity:.9}));pu.add(spr(0x66e0ff,3));pu.position.set(((rnd()*3|0)-1)*L,1.5,z-14);S.add(pu)}}
function burst(x,y,c,n){for(let i=0;i<n;i++){const s=spr(c,.7);s.position.set(x,y,0);s.userData={v:new THREE.Vector3((rnd()-.5)*6,rnd()*5,(rnd()-.5)*6),l:1};S.add(s);pts.push(s)}}

// Ses
let AC;const beep=(f,d,ty,v,f2)=>{try{AC=AC||new(window.AudioContext||webkitAudioContext)();const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(AC.destination);o.start();o.stop(n+d)}catch(e){}};

// Kontroller
const mv=d=>{if(state=='play')lane=Math.max(-1,Math.min(1,lane+d))};
